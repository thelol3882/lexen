name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # The latest npm needs Node 22.22.2 or newer.
          node-version: 24
          cache: pnpm
          # No registry-url: it writes an .npmrc with a placeholder token, which npm sends
          # instead of using trusted publishing (E401/E404).
      - run: pnpm install --frozen-lockfile
      # Trusted publishing and `npm stage` need a newer npm than Node ships.
      - run: npm install -g npm@latest
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing (OIDC, provenance added automatically). `npm stage publish` cannot log
      # in this way; the registry stages the version when the package asks for approval, and it
      # goes live after a maintainer approves it with 2FA (npmjs.com or `npm stage approve <id>`).
      - run: npm publish --access public
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
